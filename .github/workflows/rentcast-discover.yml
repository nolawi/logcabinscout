name: Discover log cabin candidates

on:
  # Once per week; max 4 RentCast requests per scheduled run.
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
    inputs:
      state:
        description: 'State to sample (manual runs only)'
        type: choice
        options: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
        required: true
        default: VA

permissions:
  contents: read

# Avoid overlapping jobs (and duplicate API charges).
concurrency:
  group: rentcast-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run discovery tests
        run: |
          node --test scripts/lib/classify-cabin.test.mjs scripts/lib/discovery-schedule.test.mjs scripts/lib/discover.test.mjs
      - name: Choose state
        id: state
        env:
          REQUESTED_STATE: ${{ github.event.inputs.state }}
        run: |
          selected=$(RENTCAST_STATE="$REQUESTED_STATE" node scripts/select-discovery-state.mjs)
          echo "state=$selected" >> "$GITHUB_OUTPUT"
          echo "Sampling state: $selected"
      - name: Check whether key is configured
        id: key
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          if [ -n "$RENTCAST_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENTCAST_API_KEY is not configured; no API requests made."
          fi
      - name: Sample RentCast (max four requests)
        if: steps.key.outputs.configured == 'true'
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          RENTCAST_STATE: ${{ steps.state.outputs.state }}
        run: node scripts/rentcast-discover.mjs
      - name: Save candidates for review
        if: success() && steps.key.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rentcast-candidates-${{ steps.state.outputs.state }}
          path: artifacts/candidates.json
          retention-days: 30
