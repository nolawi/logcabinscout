name: Publish prepared Instagram posts
on:
  workflow_dispatch:
    inputs:
      post_ids:
        description: '1–3 prepared queue IDs, separated by commas'
        type: string
        required: true
      publish:
        description: 'Publish the selected posts; false checks sources and history only'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: instagram-publishing
  cancel-in-progress: false
jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/publish-instagram-queue.mjs
        env:
          POST_IDS: ${{ inputs.post_ids }}
          PUBLISH: ${{ inputs.publish }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-publishing-receipts
          path: artifacts/instagram-receipts/
          if-no-files-found: ignore
          retention-days: 90
