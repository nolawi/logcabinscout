name: Prepare Instagram drafts

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-drafts
  cancel-in-progress: false

jobs:
  drafts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run instagram:drafts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render-social-drafts.py
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-drafts
          path: artifacts/instagram/
          retention-days: 30
          overwrite: true
